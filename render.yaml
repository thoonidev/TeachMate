services:
  - type: web
    name: teachmate
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Schema changes are applied explicitly before deploying the reviewed commit.
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_RENDER_PROXY
        value: "true"
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DB_CA_CERT_BASE64
        sync: false
